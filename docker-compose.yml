version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: pricova_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - pricova_network

  # Express.js REST API & Socket.IO Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricova_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/pricova
      - JWT_SECRET=pricova_jwt_super_secret_production_key_2026
      - JWT_EXPIRES_IN=30d
      - ADMIN_EMAIL=admin@pricova.com
      - ADMIN_PASSWORD=Admin@123
    depends_on:
      - mongo
    networks:
      - pricova_network

  # React Frontend (Vite + Nginx) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricova_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - pricova_network

volumes:
  mongo_data:
    driver: local

networks:
  pricova_network:
    driver: bridge
