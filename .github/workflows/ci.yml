name: PRICOVA Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pricova/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./pricova/backend
        run: npm ci || npm install

      - name: Run Backend Integration Tests
        working-directory: ./pricova/backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_github_actions_12345
          MONGO_URI: mongodb://localhost:27017/pricova_ci_test
        run: npm test

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pricova/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./pricova/frontend
        run: npm install --legacy-peer-deps

      - name: Compile & Build React App (Vite)
        working-directory: ./pricova/frontend
        run: npm run build
